<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AstraGuardian</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">
    <div id="three-bg"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="robot-window" id="guardian-login"></div>

            <div class="auth-form-side">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Identify yourself to access the neural cloud.</p>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Enter neural ID" required>
                    </div>
                    <div class="input-group">
                        <label>Access Key</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div id="auth-error" class="auth-msg error hidden">
                        <div id="warning-container" class="warning-graphic-container">

                                <g>

                                    <rect class="warning-rect" y="25.128" width="0.538" height="0.538"
                                        transform="translate(-25.128 25.666) rotate(-90)" fill="#FDC221" />
                                    <rect class="warning-rect" y="22.449" width="0.538" height="0.538"
                                        transform="translate(-22.449 22.987) rotate(-90)" fill="#FDC221" />
                                    <rect class="warning-rect" x="176.42" y="25.128" width="0.538" height="0.538"
                                        transform="translate(151.292 202.086) rotate(-90)" fill="#FDC221" />
                                    <rect class="warning-rect" x="176.42" y="22.449" width="0.538" height="0.538"
                                        transform="translate(153.971 199.408) rotate(-90)" fill="#FDC221" />

                                    <!-- Path lines -->
                                    <path class="warning-path-line"
                                        d="M25.949,24.432H5.565a.375.375,0,0,1,0-.75H25.52l8.068-13.7H59.015a.375.375,0,0,1,0,.75h-25Z"
                                        fill="none" stroke="#FDC221" stroke-width="0.5" />
                                    <path class="warning-path-line"
                                        d="M171.393,24.432H151.009l-8.068-13.7h-25a.375.375,0,0,1,0-.75H143.37l8.068,13.7h19.955a.375.375,0,0,1,0,.75Z"
                                        fill="none" stroke="#FDC221" stroke-width="0.5" />
                                    <path class="warning-path-line"
                                        d="M57.3,57.531a.375.375,0,0,1-.321-.182L47.147,41.043H18.507l-7.71-7.71H7.66a.375.375,0,1,1,0-.75h3.448l7.709,7.71H47.571L57.623,56.962a.376.376,0,0,1-.127.515A.382.382,0,0,1,57.3,57.531Z"
                                        fill="none" stroke="#FDC221" stroke-width="0.5" />
                                    <path class="warning-path-line"
                                        d="M119.656,57.531a.376.376,0,0,1-.321-.569l10.052-16.669h28.754l7.709-7.71H169.3a.375.375,0,0,1,0,.75h-3.137l-7.71,7.71h-28.64l-9.833,16.306A.377.377,0,0,1,119.656,57.531Z"

                                        fill="#FDC221" />

                                    <polygon class="warning-stripe"

                                    <polygon class="warning-stripe"

                                        fill="#FDC221" />
                                    <polygon class="warning-stripe"
                                        points="23.007 37.309 33.021 37.309 46.617 13.85 36.603 13.85 23.007 37.309"
                                        fill="#FDC221" />
                                    <polygon class="warning-stripe"
                                        points="125.121 37.309 115.107 37.309 101.51 13.85 111.524 13.85 125.121 37.309"
                                        fill="#FDC221" />
                                    <polygon class="warning-stripe"
                                        points="139.536 37.309 129.522 37.309 115.926 13.85 125.94 13.85 139.536 37.309"
                                        fill="#FDC221" />

                                        points="153.951 37.309 143.937 37.309 130.341 13.85 140.355 13.85 153.951 37.309"
                                        fill="#FDC221" />

                                    <!-- Exclamation -->
                                    <path class="warning-exclamation"

                                </g>
                            </svg>
                        </div>
                        <span id="error-text"></span>
                    </div>

                    <button type="submit" class="btn-main full-width">Initialize Session</button>

                    <p class="auth-footer">New discoverer? <a href="/signup">Create ID</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='js/guardian.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth-animations.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const guardian = new AstraGuardian('guardian-login');
            const errorEl = document.getElementById('auth-error');
            const errorText = document.getElementById('error-text');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // --- Robot Interactions ---
            let keystrokeCount = 0;

            usernameInput.addEventListener('focus', () => guardian.setState('watching'));
            passwordInput.addEventListener('focus', () => guardian.setState('alert'));

            [usernameInput, passwordInput].forEach(input => {
                input.addEventListener('blur', () => guardian.setState('idle'));
                input.addEventListener('input', () => {
                    keystrokeCount++;
                    guardian.setKeystrokePulse(keystrokeCount);
                    guardian.setTypingActivity(1.0);
                    // Decay handled internally or simply reset
                    setTimeout(() => guardian.setTypingActivity(0), 1000);
                });
            });

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.classList.add('hidden');
                guardian.setState('scanning');

                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });

                const data = await response.json();
                if (data.success) {
                    guardian.setState('approved');
                    gsap.to(".auth-card", {
                        scale: 0.9, opacity: 0, duration: 0.8, delay: 1.5, onComplete: () => {
                            window.location.href = '/search';
                        }
                    });
                } else {
                    guardian.setState('alert');
                    errorText.textContent = data.message;
                    errorEl.classList.remove('hidden');

                    // Trigger the WarningGraphic animation
                    animateWarningGraphic('warning-container');

                    gsap.from(errorEl, { y: -10, opacity: 0, duration: 0.3 });
                }
            });
        });
    </script>
</body>

</html>
